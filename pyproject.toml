[project]
name = "deep-research"
version = "0.1.0"
description = "Multi-agent deep research assistant built with Google ADK: plans, searches arXiv and the web, and writes cited answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "google-adk>=1.13.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.7",
    "pypdf>=5.0.0",
    "tavily-python>=0.7.11",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
]
