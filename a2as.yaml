manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: lorenzofavaro/deep-research
    source: https://github.com/lorenzofavaro/deep-research
    branch: main
    commit: "94606112"
    scope: [multi_tool_agent/agent.py, multi_tool_agent/core/agents/main/aggregate.py, multi_tool_agent/core/agents/main/answer.py,
      multi_tool_agent/core/agents/main/classify.py, multi_tool_agent/core/agents/main/plan.py, multi_tool_agent/core/agents/main/research.py,
      multi_tool_agent/core/agents/research/arxiv/arx_agent.py, multi_tool_agent/core/agents/research/arxiv/filter.py, multi_tool_agent/core/agents/research/arxiv/find.py,
      multi_tool_agent/core/agents/research/arxiv/ingest.py, multi_tool_agent/core/agents/research/arxiv/rag.py, multi_tool_agent/core/agents/research/web/search_agent.py,
      multi_tool_agent/core/services.py, multi_tool_agent/core/tools/arxiv.py, multi_tool_agent/data/document_service.py,
      multi_tool_agent/data/vector_stores/qdrant.py, multi_tool_agent/utils/config.py, multi_tool_agent/utils/logger.py, multi_tool_agent/utils/utils.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:38:59Z'
    url: https://a2as.org/certified/agents/lorenzofavaro/deep-research
  signatures:
    digest: sha256:HHG0K_siy2JKJQJZRD-OTA-agQXGGKVhl-8z7IoGthg
    key: ed25519:IKCWOMv73iI9J-GHThzSj4d18W0ggq_zBFPj2OqrCMM
    sig: ed25519:J4mVc9RICpyuXjebq1n0JPyIwJFhaOggZendxMsUnMwvc7sfprbJGiYvkcd8cki5PMhjGr2jnTNzMzzbB_Q5Cg

agents:
  agent.ArxivAgent:
    type: class
    models: [gemini-2.5-flash]
    params:
      class: ArxivAgent
      base: BaseAgent
      name: name
  agent.ArxivAgent._find_step:
    type: class
    models: [gemini-2.5-flash]
    params:
      name: find_step
      description: Find papers on arxiv
      run_id: ''
      agent_id: ''
      class: ArxivAgent
  agent.IngestStep:
    type: class
    models: [gemini-2.5-flash]
    params:
      class: IngestStep
      base: BaseAgent
  agent.RAGStep:
    type: class
    models: [gemini-2.5-flash]
    params:
      class: RAGStep
      base: BaseAgent
  agent.WebSearchAgent:
    type: class
    models: [gemini-2.5-flash]
    params:
      class: WebSearchAgent
      base: BaseAgent
      name: name
  agent.WebSearchAgent._web_search_llm:
    type: class
    models: [gemini-2.0-flash]
    tools: [MCPToolset, tavily-search]
    mcp: [MCPToolset]
    params:
      name: web_search_{agent_id}
      output_key: results:{self._run_id}:{self._agent_id}
      class: WebSearchAgent
  aggregate:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: AggregateStep
      base: BaseAgent
      name: name
      description: ''
  answer_agent.:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: AnswerAgent
      base: BaseAgent
      name: name
  answer_agent._answer_llm:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: answer
      class: AnswerAgent
  classify_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: ClassifyAgent
      instruction: [You are a Web Research Agent specialized in finding comprehensive and up-to-date information online.,
        '**Your Role:**', '- Search the internet for current, relevant information that complements academic research', '-
          Find recent developments, news, industry reports, and web-based content', '- Provide diverse perspectives and real-world
          applications of research topics', '- Identify trends, practical implementations, and emerging discussions', '**Search
          Strategy:**', 1. Analyze the user query to identify key concepts and search terms, 2. Perform targeted searches
          to gather comprehensive information, '3. Focus on credible sources: reputable websites, industry publications, tech
          blogs, company reports', 4. Look for recent content (prioritize information from the last 1-2 years when relevant),
        5. Gather multiple perspectives and viewpoints on the topic, '**Output Guidelines:**', '- Structure your response
          as a numbered list of knowledge pieces', '- For each knowledge piece, provide:', '* A clear, concise statement of
          the knowledge/insight', '* The specific online source(s) where this information was found (include URLs)', '- Focus
          on key insights, trends, and practical applications', '- Note the recency and credibility of sources when relevant',
        '**Quality Standards:**', '- Prioritize authoritative and credible sources', '- Avoid outdated information unless
          historical context is needed', '- Cross-reference information when possible', '- Be transparent about limitations
          or conflicting information found.', 'Query:', '{query}']
      description: Classify user requests and provide follow-up messages
      input_schema: UserRequest
      output_schema: ClassificationResult
      output_key: classification
  filter_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: FilterAgent
      instruction: [You are a Web Research Agent specialized in finding comprehensive and up-to-date information online.,
        '**Your Role:**', '- Search the internet for current, relevant information that complements academic research', '-
          Find recent developments, news, industry reports, and web-based content', '- Provide diverse perspectives and real-world
          applications of research topics', '- Identify trends, practical implementations, and emerging discussions', '**Search
          Strategy:**', 1. Analyze the user query to identify key concepts and search terms, 2. Perform targeted searches
          to gather comprehensive information, '3. Focus on credible sources: reputable websites, industry publications, tech
          blogs, company reports', 4. Look for recent content (prioritize information from the last 1-2 years when relevant),
        5. Gather multiple perspectives and viewpoints on the topic, '**Output Guidelines:**', '- Structure your response
          as a numbered list of knowledge pieces', '- For each knowledge piece, provide:', '* A clear, concise statement of
          the knowledge/insight', '* The specific online source(s) where this information was found (include URLs)', '- Focus
          on key insights, trends, and practical applications', '- Note the recency and credibility of sources when relevant',
        '**Quality Standards:**', '- Prioritize authoritative and credible sources', '- Avoid outdated information unless
          historical context is needed', '- Cross-reference information when possible', '- Be transparent about limitations
          or conflicting information found.', 'Query:', '{query}']
      description: Filter papers
      input_schema: PapersMetas
      output_schema: PaperIDs
      output_key: paper_ids
  find_step.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: find_step
  find_step.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: FindStep
      base: BaseAgent
      name: name
      description: ''
      instance: find_step
  parallel:
    type: instance
    params:
      name: ParallelAgent
      function: _run_async_impl
      sub_agents: [sub_agents]
  plan_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: PlanAgent
      instruction: [You are a Web Research Agent specialized in finding comprehensive and up-to-date information online.,
        '**Your Role:**', '- Search the internet for current, relevant information that complements academic research', '-
          Find recent developments, news, industry reports, and web-based content', '- Provide diverse perspectives and real-world
          applications of research topics', '- Identify trends, practical implementations, and emerging discussions', '**Search
          Strategy:**', 1. Analyze the user query to identify key concepts and search terms, 2. Perform targeted searches
          to gather comprehensive information, '3. Focus on credible sources: reputable websites, industry publications, tech
          blogs, company reports', 4. Look for recent content (prioritize information from the last 1-2 years when relevant),
        5. Gather multiple perspectives and viewpoints on the topic, '**Output Guidelines:**', '- Structure your response
          as a numbered list of knowledge pieces', '- For each knowledge piece, provide:', '* A clear, concise statement of
          the knowledge/insight', '* The specific online source(s) where this information was found (include URLs)', '- Focus
          on key insights, trends, and practical applications', '- Note the recency and credibility of sources when relevant',
        '**Quality Standards:**', '- Prioritize authoritative and credible sources', '- Avoid outdated information unless
          historical context is needed', '- Cross-reference information when possible', '- Be transparent about limitations
          or conflicting information found.', 'Query:', '{query}']
      planner: PlanReActPlanner
      description: Plan a list of steps to gather all the information needed to answer the user query
      input_schema: ClassificationResult
      output_schema: ResearchPlan
      output_key: research_plan
  research_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: ResearchAgent
      description: Coordinates research steps
      run_id: ''
      services: self.services
      function: _run_async_impl
      instance: research_agent
  research_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: ResearchAgent
      base: BaseAgent
      instance: research_agent
  root_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: root
      description: Root Agent
      classify_agent: classify_agent
      plan_agent: plan_agent
      services: ServiceContainer(config)
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: RootAgent
      base: BaseAgent
      instance: root_agent

models:
  gemini-2.0-flash:
    type: literal
    agents: [plan_agent, classify_agent, filter_agent, answer_agent._answer_llm, agent.WebSearchAgent._web_search_llm]
  gemini-2.5-flash:
    type: default
    agents: [find_step.0, research_agent.0, root_agent.0, agent.ArxivAgent._find_step, agent.ArxivAgent, agent.RAGStep, agent.IngestStep,
      agent.WebSearchAgent, aggregate, find_step.1, root_agent.1, research_agent.1, answer_agent.]

tools:
  MCPToolset:
    type: mcp
    agents: [agent.WebSearchAgent._web_search_llm]
    params:
      class: MCPToolset
      mcp_server: MCPToolset
  tavily-search:
    type: mcp
    agents: [agent.WebSearchAgent._web_search_llm]
    mcp: [MCPToolset]
    params:
      source: tool_filter
      mcp_server: MCPToolset

mcp:
  MCPToolset:
    type: process
    agents: [agent.WebSearchAgent._web_search_llm]
    params:
      class: MCPToolset
      connection_type: StdioConnectionParams
      command: npx
      args: [-y, tavily-mcp@latest]
      env:
        TAVILY_API_KEY: TAVILY_API_KEY
      timeout: "30.0"
      tool_filter: [tavily-search]

teams:
  parallel:
    type: parallel
    agents: [parallel, sub_agents]

