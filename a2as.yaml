functions:
  __init__:
    type: sync
    module: multi_tool_agent.core.agents.research.web.search_agent
    args: [self]
    params:
      returns: None
  _ensure_collection:
    type: sync
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self, collection_name]
    params:
      returns: bool
  _run_async_impl:
    type: async
    module: multi_tool_agent.core.agents.research.web.search_agent
    args: [self, context]
    params:
      returns: AsyncGenerator
  add_documents:
    type: async
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self, documents, collection_name]
    params:
      returns: bool
  chunk_text:
    type: sync
    module: multi_tool_agent.data.document_service
    args: [self, text, size]
    params:
      returns: Generator
  client:
    type: sync
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self]
    params:
      returns: QdrantClient
  create_document_service:
    type: sync
    module: multi_tool_agent.data.document_service
    args: [config]
    params:
      returns: DocumentIngestionService
  create_embedding_service:
    type: sync
    module: multi_tool_agent.data.embedding
    args: [config]
    params:
      returns: EmbeddingService
  create_vector_store:
    type: sync
    module: multi_tool_agent.data.vector_store
    args: [config]
    params:
      returns: VectorStore
  delete_document:
    type: async
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self, document_id, collection_name]
    params:
      returns: bool
  document_service:
    type: sync
    module: multi_tool_agent.core.services
    args: [self]
    params:
      returns: DocumentIngestionService
  embed_text:
    type: async
    module: multi_tool_agent.data.embeddings.openai_embeddings
    args: [self, text]
    params:
      returns: list[float]
  embed_texts:
    type: async
    module: multi_tool_agent.data.embeddings.openai_embeddings
    args: [self, texts]
    params:
      returns: list[list[float]]
  get_arxiv_paper:
    type: sync
    module: multi_tool_agent.core.tools.arxiv
    args: [arxiv_id]
    params:
      returns: tuple
  get_logger:
    type: sync
    module: multi_tool_agent.utils.logger
    args: [name]
    params:
      returns: logging.Logger
  ingest_document:
    type: async
    module: multi_tool_agent.data.document_service
    args: [self, document_id, content, metadata, collection_name, max_length]
    params:
      returns: bool
  process_text:
    type: sync
    module: multi_tool_agent.data.document_service
    args: [self, text]
    params:
      returns: str
  search:
    type: async
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self, query_vector, collection_name, top_k, filters]
    params:
      returns: list[SearchResult]
  search_arxiv:
    type: sync
    module: multi_tool_agent.core.tools.arxiv
    args: [query, max_results, start]
    params:
      returns: list[dict]
  search_by_text:
    type: async
    module: multi_tool_agent.data.vector_stores.qdrant
    args: [self, query_text, collection_name, top_k, filters]
    params:
      returns: list[SearchResult]
  search_documents:
    type: async
    module: multi_tool_agent.data.document_service
    args: [self, query_text, top_k, include_content, filters, collection_name]
    params:
      returns: list[dict]
  setup_logger:
    type: sync
    module: multi_tool_agent.utils.logger
    args: [name, level]
    params:
      returns: logging.Logger
  to_dict:
    type: sync
    module: multi_tool_agent.utils.config
    args: [self]
    params:
      returns: dict
  valid_uuid:
    type: sync
