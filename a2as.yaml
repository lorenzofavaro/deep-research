networks:
  arxiv.org:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://arxiv.org/pdf/{arxiv_id}.pdf
      caller: [get_arxiv_paper]
  arxiv.org.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://arxiv.org/abs/{arxiv_id}
      caller: [get_arxiv_paper]
